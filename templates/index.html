<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Nhap Xuat Du Lieu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-3">Ứng Dụng Nhập / Xuất Dữ Liệu</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Dữ liệu nhập vào:</label>
                    <textarea name="text_data" class="form-control" rows="4" placeholder="Nhập văn bản tại đây..." required>{{ user_input }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Xử lý & Xuất kết quả</button>
            </form>

            {% if result %}
            <div class="mt-4 p-3 bg-white border rounded">
                <h5 class="text-success">Kết quả xuất ra:</h5>
                <ul class="list-unstyled mb-0">
                    <li><strong>Số ký tự:</strong> {{ result.char_count }}</li>
                    <li><strong>Số từ:</strong> {{ result.word_count }}</li>
                    <li><strong>Chuỗi đảo ngược:</strong> {{ result.reversed_text }}</li>
                </ul>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
